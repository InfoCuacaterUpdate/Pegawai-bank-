<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obrolan</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; display: flex; height: 100vh; background: #e5ddd5; overflow: hidden; }

        /* SIDEBAR KIRI */
        #sidebar { width: 30%; background: #ffffff; border-right: 1px solid #ccc; display: flex; flex-direction: column; height: 100%; }
        .header { background: #075e54; color: white; padding: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .search-box { padding: 15px; border-bottom: 1px solid #ddd; background: #f0f0f0; }
        .search-box input { width: 100%; padding: 12px 20px; border-radius: 25px; border: 1px solid #ccc; outline: none; font-size: 14px;}
        
        #searchResults { overflow-y: auto; flex: 1; padding: 10px; }
        
        /* DESAIN KARTU TEMAN BARU */
        .user-item { 
            display: flex; 
            align-items: center; 
            padding: 15px; 
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: 0.2s;
        }
        .user-item:hover { background: #f0f8ff; border-color: #007bff; }
        .avatar { 
            width: 40px; height: 40px; 
            background: #007bff; color: white; 
            border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; 
            font-weight: bold; font-size: 18px; margin-right: 15px;
        }
        .user-name { font-weight: bold; color: #333; font-size: 16px;}

        /* AREA CHAT KANAN */
        #main-chat { width: 70%; display: flex; flex-direction: column; height: 100%; position: relative; background: #e5ddd5; }
        #chat-header { background: #075e54; color: white; padding: 15px; font-weight: bold; display: flex; align-items: center; }
        #btnBack { display: none; background: none; border: none; color: white; font-size: 24px; margin-right: 15px; cursor: pointer; }
        
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; }
        .message { max-width: 75%; padding: 10px 15px; margin-bottom: 10px; border-radius: 15px; word-wrap: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.1); font-size: 14px;}
        .msg-me { background: #dcf8c6; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg-other { background: white; align-self: flex-start; border-bottom-left-radius: 2px; }
        
        /* INPUT AREA */
        #input-area { display: none; padding: 10px; background: #f0f0f0; align-items: center; }
        #input-area input { flex: 1; padding: 12px 20px; border-radius: 25px; border: 1px solid #ccc; outline: none; font-size: 14px;}
        #input-area button { margin-left: 8px; padding: 12px 15px; border: none; background: #075e54; color: white; border-radius: 50%; cursor: pointer; font-size: 16px;}
        #btnLokasi { background: #007bff !important; }

        /* TAMPILAN UNTUK HP (MOBILE) */
        @media (max-width: 768px) {
            #sidebar { width: 100%; }
            #main-chat { width: 100%; display: none; }
            body.show-chat #sidebar { display: none; }
            body.show-chat #main-chat { display: flex; }
            #btnBack { display: block; }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR PENCARIAN TEMAN -->
    <div id="sidebar">
        <div class="header">
            <span id="myUsername">Memuat...</span>
            <button id="btnLogout" style="background:#ff4d4d; color:white; border:none; padding:8px 12px; border-radius:5px; cursor:pointer; font-size:12px; font-weight:bold;">Keluar</button>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Cari username teman...">
        </div>
        <div id="searchResults">
            <p style="text-align:center; color:#888; margin-top:20px; font-size:14px;">Ketik username teman Anda.</p>
        </div>
    </div>

    <!-- AREA OBROLAN -->
    <div id="main-chat">
        <div id="chat-header">
            <button id="btnBack">&#8592;</button>
            <span id="chatTitle">Pilih teman</span>
        </div>
        <div id="messages"></div>
        
        <!-- Area Ketik -->
        <div id="input-area">
            <button id="btnLokasi" title="Kirim Lokasi">📍</button>
            <input type="text" id="messageInput" placeholder="Ketik pesan...">
            <button id="btnKirim">&#10148;</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getDatabase, ref, push, onValue, query, orderByChild, equalTo, get } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
        import { firebaseConfig } from './firebase-config.js';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUser = null;
        let activeChatUser = null;
        let chatRoomId = null;
        let unreadListener = null;

        const searchInput = document.getElementById("searchInput");
        const searchResults = document.getElementById("searchResults");
        const messagesDiv = document.getElementById("messages");
        const inputArea = document.getElementById("input-area");
        const chatTitle = document.getElementById("chatTitle");

        // 1. CEK STATUS LOGIN
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const snapshot = await get(ref(db, 'users/' + user.uid));
                if (snapshot.exists()) {
                    currentUser = { uid: user.uid, username: snapshot.val().username };
                    document.getElementById("myUsername").innerText = currentUser.username;
                }
            } else {
                window.location.href = "index.html";
            }
        });

        // 2. LOGOUT
        document.getElementById("btnLogout").addEventListener("click", () => {
            signOut(auth).then(() => window.location.href = "index.html");
        });

        // 3. PENCARIAN USERNAME
        searchInput.addEventListener("input", async (e) => {
            const keyword = e.target.value.toLowerCase().trim();
            searchResults.innerHTML = "";

            if (keyword.length < 1) {
                searchResults.innerHTML = "<p style='text-align:center; color:#888; margin-top:20px; font-size:14px;'>Ketik username teman Anda.</p>";
                return;
            }

            const usersRef = query(ref(db, 'users'), orderByChild('username'), equalTo(keyword));
            const snapshot = await get(usersRef);

            if (snapshot.exists()) {
                snapshot.forEach((childSnapshot) => {
                    const userData = childSnapshot.val();
                    const uid = childSnapshot.key;

                    if (uid !== currentUser.uid) {
                        // Buat Kartu User
                        const div = document.createElement("div");
                        div.className = "user-item";
                        
                        const inisial = userData.username.charAt(0).toUpperCase();
                        
                        div.innerHTML = `
                            <div class="avatar">${inisial}</div>
                            <div class="user-name">${userData.username}</div>
                        `;
                        
                        div.onclick = () => mulaiChat(uid, userData.username);
                        searchResults.appendChild(div);
                    }
                });
            } else {
                searchResults.innerHTML = "<p style='text-align:center; color:red; margin-top:20px; font-size:14px;'>User tidak ditemukan.</p>";
            }
        });

        // 4. FUNGSI MEMULAI CHAT
        function mulaiChat(targetUid, targetUsername) {
            activeChatUser = { uid: targetUid, username: targetUsername };
            chatTitle.innerText = targetUsername; 
            
            inputArea.style.display = "flex";
            document.body.classList.add('show-chat'); 

            chatRoomId = [currentUser.uid, targetUid].sort().join("_");
            tampilkanPesan();
        }

        // Tombol Kembali (Untuk HP)
        document.getElementById("btnBack").addEventListener("click", () => {
            document.body.classList.remove('show-chat');
            chatTitle.innerText = "Pilih teman";
            inputArea.style.display = "none";
            messagesDiv.innerHTML = ""; 
            if(unreadListener) unreadListener(); 
        });

        // 5. TAMPILKAN PESAN
        function tampilkanPesan() {
            if(unreadListener) unreadListener();
            messagesDiv.innerHTML = "";

            const chatRef = ref(db, 'chats/' + chatRoomId + '/messages');
            unreadListener = onValue(chatRef, (snapshot) => {
                messagesDiv.innerHTML = "";
                if (snapshot.exists()) {
                    snapshot.forEach((child) => {
                        const msg = child.val();
                        const isMe = msg.sender === currentUser.uid;
                        
                        const div = document.createElement("div");
                        div.className = "message " + (isMe ? "msg-me" : "msg-other");

                        let konten = "";
                        if (msg.text) konten = msg.text;
                        if (msg.location) {
                            konten = `<a href="https://www.google.com/maps?q=${msg.location.lat},${msg.location.lng}" target="_blank" style="color:#007bff; text-decoration:none; font-weight:bold;">📍 Lihat Lokasi</a>`;
                        }

                        div.innerHTML = konten;
                        messagesDiv.appendChild(div);
                    });
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                }
            });
        }

        // 6. KIRIM PESAN
        function kirimPesan(teks, lokasi = null) {
            if (!chatRoomId) return;
            
            const pesanRef = ref(db, 'chats/' + chatRoomId + '/messages');
            const dataPesan = {
                sender: currentUser.uid,
                timestamp: Date.now()
            };
            if (teks) dataPesan.text = teks;
            if (lokasi) dataPesan.location = lokasi;

            push(pesanRef, dataPesan);
        }

        // Event Listener
        document.getElementById("btnKirim").addEventListener("click", () => {
            const input = document.getElementById("messageInput");
            if (input.value.trim() !== "") {
                kirimPesan(input.value.trim());
                input.value = "";
            }
        });

        document.getElementById("messageInput").addEventListener("keypress", (e) => {
            if (e.key === 'Enter') document.getElementById("btnKirim").click();
        });

        document.getElementById("btnLokasi").addEventListener("click", () => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    const lokasi = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    kirimPesan(null, lokasi);
                }, () => alert("Gagal mengambil lokasi. Pastikan izin GPS/Lokasi di HP Anda aktif."));
            } else {
                alert("Browser Anda tidak mendukung fitur lokasi.");
            }
        });

    </script>
</body>
</html>
