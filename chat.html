<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obrolan</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; display: flex; height: 100vh; background: #e5ddd5; }
        /* Sidebar Kiri (Daftar Teman) */
        #sidebar { width: 30%; background: #ffffff; border-right: 1px solid #ccc; display: flex; flex-direction: column; }
        .header { background: #075e54; color: white; padding: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center;}
        .search-box { padding: 10px; border-bottom: 1px solid #ddd; }
        .search-box input { width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        #searchResults { overflow-y: auto; flex: 1; }
        .user-item { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; }
        .user-item:hover { background: #f9f9f9; }
        
        /* Area Chat Kanan */
        #main-chat { width: 70%; display: flex; flex-direction: column; position: relative; }
        #chat-header { background: #075e54; color: white; padding: 15px; font-weight: bold; }
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; }
        .message { max-width: 60%; padding: 10px; margin-bottom: 10px; border-radius: 8px; word-wrap: break-word; }
        .msg-me { background: #dcf8c6; align-self: flex-end; }
        .msg-other { background: white; align-self: flex-start; }
        .sender-name { font-size: 10px; color: gray; margin-bottom: 3px; display: block; }
        .msg-time { font-size: 10px; color: gray; text-align: right; display: block; margin-top: 5px; }
        
        /* Input Area */
        #input-area { display: flex; padding: 10px; background: #f0f0f0; }
        #input-area input { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ccc; outline: none; }
        #input-area button { margin-left: 10px; padding: 10px 15px; border: none; background: #075e54; color: white; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body>

    <!-- SIDEBAR PENCARIAN TEMAN -->
    <div id="sidebar">
        <div class="header">
            <span id="myUsername">Memuat...</span>
            <button id="btnLogout" style="background:red; color:white; border:none; padding:5px; cursor:pointer;">Keluar</button>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Cari username teman...">
        </div>
        <div id="searchResults">
            <p style="padding:10px; color:gray; font-size:12px;">Ketik username untuk mencari teman.</p>
        </div>
    </div>

    <!-- AREA OBROLAN -->
    <div id="main-chat">
        <div id="chat-header">Pilih teman untuk mulai mengobrol</div>
        <div id="messages"></div>
        
        <!-- Area Ketik -->
        <div id="input-area" style="display: none;">
            <button id="btnLokasi" title="Kirim Lokasi" style="background:#007bff; margin-right:5px;">📍</button>
            <input type="text" id="messageInput" placeholder="Ketik pesan...">
            <button id="btnKirim">Kirim</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getDatabase, ref, set, push, onValue, query, orderByChild, equalTo, get, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
        import { firebaseConfig } from './firebase-config.js';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUser = null; // Menyimpan data user yang login
        let activeChatUser = null; // Menyimpan data teman yang sedang di-chat
        let chatRoomId = null;

        // 1. CEK STATUS LOGIN
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // Ambil username dari database
                const snapshot = await get(ref(db, 'users/' + user.uid));
                if (snapshot.exists()) {
                    currentUser = { uid: user.uid, username: snapshot.val().username };
                    document.getElementById("myUsername").innerText = currentUser.username;
                }
            } else {
                window.location.href = "index.html"; // Tendang ke login jika belum masuk
            }
        });

        // 2. LOGOUT
        document.getElementById("btnLogout").addEventListener("click", () => {
            signOut(auth).then(() => window.location.href = "index.html");
        });

        // 3. FITUR PENCARIAN USERNAME
        const searchInput = document.getElementById("searchInput");
        const searchResults = document.getElementById("searchResults");

        searchInput.addEventListener("input", async (e) => {
            const keyword = e.target.value.toLowerCase().trim();
            searchResults.innerHTML = "";

            if (keyword.length < 1) {
                searchResults.innerHTML = "<p style='padding:10px; color:gray; font-size:12px;'>Ketik username untuk mencari teman.</p>";
                return;
            }

            // Cari di database users yang username-nya sama persis
            const usersRef = query(ref(db, 'users'), orderByChild('username'), equalTo(keyword));
            const snapshot = await get(usersRef);

            if (snapshot.exists()) {
                snapshot.forEach((childSnapshot) => {
                    const userData = childSnapshot.val();
                    const uid = childSnapshot.key;

                    if (uid !== currentUser.uid) { // Jangan tampilkan diri sendiri
                        const div = document.createElement("div");
                        div.className = "user-item";
                        div.innerText = userData.username;
                        div.onclick = () => mulaiChat(uid, userData.username);
                        searchResults.appendChild(div);
                    }
                });
            } else {
                searchResults.innerHTML = "<p style='padding:10px; color:red; font-size:12px;'>User tidak ditemukan.</p>";
            }
        });

        // 4. FUNGSI MEMULAI CHAT
        function mulaiChat(targetUid, targetUsername) {
            activeChatUser = { uid: targetUid, username: targetUsername };
            document.getElementById("chat-header").innerText = "Obrolan dengan: " + targetUsername;
            document.getElementById("input-area").style.display = "flex";

            // Buat ID Room (Diurutkan Abjad agar unik untuk 2 orang)
            chatRoomId = [currentUser.uid, targetUid].sort().join("_");
            
            // Tampilkan pesan
            tampilkanPesan();
        }

        // 5. TAMPILKAN PESAN & KIRIM PESAN
        const messagesDiv = document.getElementById("messages");
        let unreadListener = null;

        function tampilkanPesan() {
            if(unreadListener) unreadListener(); // Matikan listener chat sebelumnya
            messagesDiv.innerHTML = "";

            const chatRef = ref(db, 'chats/' + chatRoomId + '/messages');
            unreadListener = onValue(chatRef, (snapshot) => {
                messagesDiv.innerHTML = "";
                if (snapshot.exists()) {
                    snapshot.forEach((child) => {
                        const msg = child.val();
                        const isMe = msg.sender === currentUser.uid;
                        
                        const div = document.createElement("div");
                        div.className = "message " + (isMe ? "msg-me" : "msg-other");

                        let konten = "";
                        if (msg.text) konten = msg.text;
                        if (msg.location) {
                            konten = `<a href="https://www.google.com/maps?q=${msg.location.lat},${msg.location.lng}" target="_blank">📍 Lihat Lokasi Pengirim</a>`;
                        }
                        // Nanti bisa ditambahkan logika untuk msg.imageUrl

                        div.innerHTML = `
                            ${!isMe ? `<span class="sender-name">${activeChatUser.username}</span>` : ''}
                            ${konten}
                        `;
                        messagesDiv.appendChild(div);
                    });
                    messagesDiv.scrollTop = messagesDiv.scrollHeight; // Auto scroll ke bawah
                }
            });
        }

        // Fungsi Kirim Pesan
        function kirimPesan(teks, lokasi = null) {
            if (!chatRoomId) return;
            
            const pesanRef = ref(db, 'chats/' + chatRoomId + '/messages');
            const dataPesan = {
                sender: currentUser.uid,
                timestamp: Date.now()
            };
            if (teks) dataPesan.text = teks;
            if (lokasi) dataPesan.location = lokasi;

            push(pesanRef, dataPesan);
        }

        // Event Listener Tombol Kirim Teks
        document.getElementById("btnKirim").addEventListener("click", () => {
            const input = document.getElementById("messageInput");
            if (input.value.trim() !== "") {
                kirimPesan(input.value.trim());
                input.value = "";
            }
        });

        // Event Listener Enter
        document.getElementById("messageInput").addEventListener("keypress", (e) => {
            if (e.key === 'Enter') document.getElementById("btnKirim").click();
        });

        // Event Listener Tombol Lokasi
        document.getElementById("btnLokasi").addEventListener("click", () => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    const lokasi = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    kirimPesan(null, lokasi);
                }, () => alert("Gagal mengambil lokasi. Pastikan izin lokasi aktif."));
            } else {
                alert("Browser Anda tidak mendukung fitur lokasi.");
            }
        });

    </script>
</body>
</html>
